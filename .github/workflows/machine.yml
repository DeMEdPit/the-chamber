name: machine

on:
  push:
    paths:
      - 'machine/**'
      - 'registry.py'
      - 'page.py'
      - 'footer.py'
      - 'build-all.py'
      - 'check-site.py'
      - '.github/workflows/machine.yml'
  pull_request:
    paths:
      - 'machine/**'
      - 'registry.py'
      - 'page.py'
      - 'footer.py'
      - 'build-all.py'
      - 'check-site.py'
      - '.github/workflows/machine.yml'

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the machine documents and hold them to the committed copies
        run: |
          python3 machine/build.py
          git diff --exit-code -- machine/core.html machine/standalone.html

      - name: The catalogue against itself and the copies, and the verifier against synthetic bytes
        run: |
          python3 machine/verify.py --offline
          python3 machine/test/test_verify.py

      - name: The scan's gate
        run: node machine/test/scan.mjs

      - name: The disk image reader's gate
        run: node machine/test/d64.mjs

      - name: The cartridge reader's gate
        run: node machine/test/crt.mjs

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: The bridge gate
        run: node machine/test/bridge.mjs

      - name: The page's gate, against a synthetic chain
        run: node machine/test/page.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: machine-evidence
          path: machine/test/evidence
          if-no-files-found: ignore
