<!doctype html>
<!-- SPDX-License-Identifier: MIT
     The bridge harness: a bare host page for the headless gate. It uses the
     real bridge client, so what the test drives is what the site's page will
     drive; raw() speaks the protocol without the client, as a stranger's
     host would. window.harness is the test's handle. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>bridge harness</title>
<style>body{margin:0;background:#111;color:#ccc;font:13px ui-monospace,monospace} #box{width:768px;height:544px}</style>
</head>
<body>
<div id="box"></div>
<script type="module">
import { createMachine, bootFromSite, partsFromSite, bootMachine, PROTOCOL, STATUS, PINS } from '../bridge-client.js';
const box = document.getElementById('box');
const plain = (r) => (r && r.bytes instanceof ArrayBuffer) ? Object.assign({}, r, { bytes: Array.from(new Uint8Array(r.bytes)) }) : r;
window.harness = {
  PROTOCOL, STATUS, PINS, events: [], machine: null,
  create() {
    this.destroy();
    this.events = [];
    this.machine = createMachine({ container: box, onEvent: (e) => this.events.push(e) });
    return this.machine.hello;
  },
  async boot({ firmware = true } = {}) {
    let hello = null, ready = null, error = null;
    try { hello = await this.create(); ready = await bootFromSite(this.machine, { firmware }); }
    catch (e) { error = { code: e.code, text: e.message }; }
    return { hello, ready, error };
  },
  async bootTampered() {
    const hello = await this.create();
    const got = await partsFromSite();
    const parts = got.parts.map((b) => b.slice(0));
    new Uint8Array(parts[1])[100] ^= 0x01;
    try { const r = await bootMachine(this.machine, { parts, roms: got.roms }); return { hello, ok: true, r }; }
    catch (e) { return { hello, ok: false, code: e.code, text: e.message }; }
  },
  async bootWrongRoms() {
    const hello = await this.create();
    const got = await partsFromSite();
    const roms = { kernal: got.roms.kernal.slice(0), basic: got.roms.basic.slice(0), chargen: got.roms.chargen.slice(0) };
    new Uint8Array(roms.basic)[10] ^= 0x01;
    try { const r = await bootMachine(this.machine, { parts: got.parts, roms }); return { hello, ok: true, r }; }
    catch (e) { return { hello, ok: false, code: e.code, text: e.message, alive: this.machine.alive }; }
  },
  request(type, body, opts) {
    return this.machine.request(type, body || {}, opts || {})
      .then((r) => ({ ok: true, r: plain(r) }), (e) => ({ ok: false, code: e.code, text: e.message }));
  },
  load(arr, label, kind = 'prg') {
    const bytes = new Uint8Array(arr).buffer;
    return this.request('load', { kind, bytes, label }, { transfer: [bytes] });
  },
  alive() { return !!(this.machine && this.machine.alive); },
  reason() { return this.machine ? this.machine.reason : null; },
  frameCount() { return document.querySelectorAll('iframe').length; },
  destroy() { if (this.machine) { this.machine.destroy(); this.machine = null; } },
  /** The protocol without the client: a raw frame, a raw port, these messages, the replies. */
  raw(messages, wait = 800) {
    return new Promise((resolve) => {
      const f = document.createElement('iframe');
      f.setAttribute('sandbox', 'allow-scripts');
      f.src = '../core.html';
      const got = [];
      let hello = null;
      f.addEventListener('load', () => {
        const ch = new MessageChannel();
        ch.port1.onmessage = (e) => {
          if (e.data && e.data.type === 'hello' && !hello) {
            hello = e.data;
            for (const m of messages) ch.port1.postMessage(m);
            setTimeout(() => { f.remove(); resolve({ hello, replies: got.map(plain) }); }, wait);
          } else got.push(e.data);
        };
        f.contentWindow.postMessage({ v: 1, type: 'port' }, '*', [ch.port2]);
      });
      box.appendChild(f);
    });
  },
};
</script>
</body>
</html>
