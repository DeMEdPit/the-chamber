  THE MACHINE: the machine document. READY 64 is the machine inside it.

  One source, two builds (machine/build.py):
    machine/core.html         EMBEDDED: fed every byte by a host page over a
                              MessagePort; carries a policy whose connect-src
                              is data: alone (nopsta's build fetches its own
                              WebAssembly from a data URL inside its script;
                              a data URL reaches no network) and no network
                              code at all; meant to be loaded in a frame
                              sandboxed to scripts only.
    machine/standalone.html   STANDALONE: reads the machine from Ethereum
                              mainnet itself, as the launcher core does, and
                              boots to READY; for the bench, for a stranger
                              and for the copy-and-run case.
  The regions that differ are marked EMBEDDED / STANDALONE on their own
  lines; the build keeps one set and drops the markers. Nothing here decides
  which build it is at run time.

  What it does: reads, or is handed, the four parts of minimal64, the C64
  emulator nopsta stored on Ethereum in 2022, checks each against the sha256
  pinned below, runs them; takes the OpenROMs firmware (pressing 1) when it
  is given or found, fills the emulator's ROM hooks, and boots. Edge to edge,
  no text, no frame. Whatever is around this picture is the host's.

  The bridge (protocol 1, machine/PROTOCOL.md): a host transfers one
  MessagePort into this document; everything after runs on that port with
  request ids. Program bytes travel as ArrayBuffers, never as markup. Writes
  to the machine from outside (poke) are refused until the host turns LAB
  on, and the first one that lands is reported as INTERVENED for the life
  of this document.

  Changed by CypherDAO, 2026-09-22 (the notice GPLv2 section 2(a) asks a
  modified file to carry): derived from the READY 64 launcher core, itself
  from nopsta's example player (minimal64/example/, 2022). The changes: the
  EMBEDDED and STANDALONE regions and the build that selects one; the
  bridge (protocol 1) with its schema, ids and refusal codes; the
  start-from-parts path that refuses to run without SHA-256 or on a pin
  mismatch and reports the firmware's hashes; the emulator's abort hook;
  the LAB gate and the INTERVENED mark. Later changes are in this file's
  history in the public repository.

  The STANDALONE build is a harness and a copy-and-run surface: it reads
  whatever RPC it is pointed at and carries no policy. The boundary
  described above is the EMBEDDED build's alone; nothing said of the
  embedded document is a claim about standalone.html.

    standalone.html                boot the firmware machine to READY
    standalone.html?mode=bare      the bare machine, no firmware
    standalone.html?prg=<hex>      boot, then inject and run this PRG

<script>
'use strict';

/*@EMBEDDED*/
var BUILD = 'embedded';
/*@END-EMBEDDED*/
/*@STANDALONE*/

/*@END-STANDALONE*/

/* ------------------------------------------------------------ config
   Everything this document trusts is here. Addresses are mainnet. The four
   emulator parts are pinned by the sha256 of their payload (the bytes after
   the STOP prefix), captured from the chain in 2026 and equal to the hashes
   in the READY 64 provenance record and in machine/parts/MANIFEST.json,
   which the build holds equal to these. Whoever hands this document the
   parts, it checks them against these pins before running them. The
   firmware is not pinned here: it is found through the release root and
   checked against the ROM set contract's own stated hashes, so a later
   pressing is one address change; a host that hands the ROMs in has done
   that check itself and says so in its own provenance. */
var CONFIG = {
  chainId: 1,
  rpcs: [
    'https://ethereum-rpc.publicnode.com',
    'https://eth.llamarpc.com',
    'https://eth.drpc.org',
    'https://gateway.tenderly.co/public/mainnet',
    'https://cloudflare-eth.com'
  ],
  emulator: [
    { name: 'gunzip helper', addr: '0x1Cc49e603B4b205Be0E74f8833971Bea5beccEC9',
      sha256: 'ac9c3eaaa9bbb413b9e6826e12cfc685e69819811147c09e6bd9ec749443edae' },
    { name: 'minimal64 part 0', addr: '0xEF13021d5302c3fCe437A3C281A286479ba60008',
      sha256: '6124c18b000acfc4e986754f58c7ce4d212d220693e0f981ad4492a6afa5fc8d' },
    { name: 'minimal64 part 1', addr: '0x9A463234988C0F77ca1252Fc974DfD6b50AAA6Ba',
      sha256: '94250fe97b8c4cc957e36b7527cd19f60a17d5af6024692cb4de60ba8b75047f' },
    { name: 'minimal64 part 2', addr: '0xf6Fb8cefFff7239d9689acDF1FBF5376C9996dA5',
      sha256: '31f2789c39cbec739bf3cb5c911498ec8097f1623bc2c052f81b36a807ff6ad2' }
  ],
  /* OpenROMs C64 firmware, pressing 1: the release root. */
  firmwareRoot: '0xE0a71d57FB514C8f5793e26937559935350b3406',
  selectors: {
    roms: '0x9670b2c4',            /* Release.roms() -> ROMSet */
    kernal: '0xc9d4a352',          /* ROMSet.kernal() -> DataBlob */
    basic: '0x15e8b345',
    chargen: '0x57e0538e',
    kernalSha: '0x0aa0f7b1',       /* ROMSet.KERNAL_SHA256() */
    basicSha: '0xa4e3a60f',
    chargenSha: '0x4730b6ac'
  }
};

/* ------------------------------------------------------------ protocol
   The bridge's constants. PROTOCOL is the version a host must speak;
   CAPABILITIES is what this document can do, stated in hello so a host
   renders its controls from facts. A new capability is a new entry and a
   new message, never a change to an old one (machine/PROTOCOL.md). */
var PROTOCOL = 1;
var MACHINE = 'minimal64-2022';
var CAPABILITIES = {
  loads: ['prg', 'crt'],
  input: ['keyboard', 'joystick2', 'joystick1'],
  firmware: true,
  screenText: true,
  peek: true,
  poke: true,
  audio: true,
  snapshots: false
};
var LIMITS = { prg: 65538, crt: 525376, text: 4096, machine: 1048576, peek: 65536 };   // crt: a 64-byte header and 64 CHIP packets of 8K, the machine's ROML banks
/* The one word of the trust vocabulary this document ever uses of itself:
   the emulator it runs matched the pins above, known before it was asked.
   It holds no pin for the firmware and says nothing about it but its
   measured hashes; that claim is the host's to make. */
var STATUS_PINNED = 'PINNED';

/* ------------------------------------------------------------ mode
   Defaults; the standalone build reads its address for these, the embedded
   build is told by message. */
var MODE = 'firmware';
var INPUT = 'keyboard';
var JOYPORT = 2;   // the port the keys and the joystick messages feed: 2, as the programs of the series read, or 1; the emulator's array is 0-based
var PRG_HEX = '';
/*@STANDALONE*/
var params = new URLSearchParams(location.search);
if (params.get('mode') === 'bare') MODE = 'bare';
if (params.get('input') === 'joystick') INPUT = 'joystick';
if (params.get('rpc')) CONFIG.rpcs = [params.get('rpc')].concat(CONFIG.rpcs);
PRG_HEX = (params.get('prg') || '').replace(/^0x/i, '');
/*@END-STANDALONE*/

/* ------------------------------------------------------------ status */
var statusEl = document.getElementById('status');
var listeners = [];
var STATE = { phase: 'loading', mode: MODE, input: INPUT, log: [], fetched: 0, ms: 0, error: null,
              program: null, intervened: false, lab: false, build: BUILD };
function say(msg, done) {
  STATE.log.push(msg);
  statusEl.textContent = msg;
  if (done) statusEl.hidden = true; else statusEl.hidden = false;
  for (var i = 0; i < listeners.length; i++) { try { listeners[i](msg, STATE); } catch (e) {} }
  if (msg) event('status', { text: msg });
}
function refusal(code, text) {
  var e = new Error(text || code);
  e.code = code;
  return e;
}
function fail(msg) {
  STATE.phase = 'failed'; STATE.error = msg;
  say('failed: ' + msg);
  throw new Error(msg);
}
function hexToBytes(hex) {
  var h = hex.replace(/^0x/i, '');
  var out = new Uint8Array(h.length / 2);
  for (var i = 0; i < out.length; i++) out[i] = parseInt(h.substr(i * 2, 2), 16);
  return out;
}
async function sha256Hex(bytes) {
  var d = await crypto.subtle.digest('SHA-256', bytes);
  return Array.prototype.map.call(new Uint8Array(d), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
}

/*@STANDALONE*/
/* ------------------------------------------------------------ rpc
   Plain JSON-RPC over fetch, one call at a time, failing over across the
   list. Every read is a view: eth_getCode for bytes, eth_call for the few
   getters the firmware lookup needs. This whole region is absent from the
   embedded build, whose policy forbids every connection to a network. */
var rpcInUse = null;
async function rpc(method, p) {
  var order = rpcInUse ? [rpcInUse].concat(CONFIG.rpcs.filter(function (u) { return u !== rpcInUse; })) : CONFIG.rpcs;
  var lastErr = null;
  for (var i = 0; i < order.length; i++) {
    var url = order[i];
    try {
      var res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: method, params: p }) });
      if (!res.ok) throw new Error('http ' + res.status);
      var j = await res.json();
      if (j.error) throw new Error(j.error.message || 'rpc error');
      if (j.result === undefined || j.result === null) throw new Error('empty result');
      rpcInUse = url;
      STATE.rpc = url;
      return j.result;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('no rpc answered');
}
/* A data contract's runtime is one STOP byte and then the payload. */
async function getPayload(addr) {
  var code = await rpc('eth_getCode', [addr, 'latest']);
  var bytes = hexToBytes(code);
  if (bytes.length < 2 || bytes[0] !== 0) throw new Error('not a data contract: ' + addr);
  STATE.fetched += bytes.length;
  return bytes.subarray(1);
}
async function callAddress(to, selector) {
  var r = await rpc('eth_call', [{ to: to, data: selector }, 'latest']);
  var h = r.replace(/^0x/i, '');
  if (h.length < 64) throw new Error('short return from ' + to);
  return '0x' + h.slice(24, 64);
}
async function callBytes32(to, selector) {
  var r = await rpc('eth_call', [{ to: to, data: selector }, 'latest']);
  var h = r.replace(/^0x/i, '');
  if (h.length < 64) throw new Error('short return from ' + to);
  return h.slice(0, 64);
}

/* ------------------------------------------------------------ fetch */
async function fetchMachine() {
  var t0 = performance.now();
  var chain;
  try { chain = await rpc('eth_chainId', []); }
  catch (e) { throw refusal('RPC_UNAVAILABLE', 'no rpc answered: ' + (e && e.message || e)); }
  if (parseInt(chain, 16) !== CONFIG.chainId) fail('wrong chain: ' + chain);
  var parts = [];
  for (var i = 0; i < CONFIG.emulator.length; i++) {
    var p = CONFIG.emulator[i];
    say('reading the machine from ethereum, ' + (i + 1) + ' of 4');
    parts.push(await getPayload(p.addr));
  }
  var roms = null;
  if (MODE === 'firmware') {
    say('finding the firmware through the release root');
    var romset = await callAddress(CONFIG.firmwareRoot, CONFIG.selectors.roms);
    var addrs = { kernal: await callAddress(romset, CONFIG.selectors.kernal),
                  basic: await callAddress(romset, CONFIG.selectors.basic),
                  chargen: await callAddress(romset, CONFIG.selectors.chargen) };
    var want = { kernal: await callBytes32(romset, CONFIG.selectors.kernalSha),
                 basic: await callBytes32(romset, CONFIG.selectors.basicSha),
                 chargen: await callBytes32(romset, CONFIG.selectors.chargenSha) };
    roms = {};
    var names = ['kernal', 'basic', 'chargen'];
    for (var k = 0; k < names.length; k++) {
      say('reading the firmware from ethereum, ' + (k + 1) + ' of 3');
      var rb = await getPayload(addrs[names[k]]);
      var rh = await sha256Hex(rb);
      if (rh !== want[names[k]]) throw refusal('HASH_MISMATCH', names[k] + ' ROM does not match the hash the ROM set states');
      roms[names[k]] = rb;
    }
    /* The hashes came from the ROM set contract and the bytes from the
       blobs it names, both through the one node asked: CONTRACT-CONSISTENT,
       never PINNED, which would need a commitment held before asking. */
    STATE.firmware = { romset: romset, addresses: addrs, sha256: want, status: 'CONTRACT-CONSISTENT' };
  }
  STATE.ms = Math.round(performance.now() - t0);
  return { parts: parts, roms: roms };
}
/*@END-STANDALONE*/

/* ------------------------------------------------------------ emulator
   The four parts concatenate to two script tags: a data-URI script that
   defines gunzip and b64GzScript, then an inline script whose one call
   inflates the emulator and appends it to the document. Both are run here
   exactly as a page assembled by the on-chain launcher would run them,
   just by hand instead of by the parser. */
function runEmulatorParts(parts) {
  var text = '';
  var dec = new TextDecoder();
  for (var i = 0; i < parts.length; i++) text += dec.decode(parts[i]);
  var m = text.match(/<script src="(data:text\/javascript;base64,[^"]+)"><\/script>/);
  if (!m) fail('the gunzip helper did not look like a script tag');
  var inline = text.slice(m.index + m[0].length).match(/<script>([\s\S]*?)<\/script>/);
  if (!inline) fail('the emulator parts did not look like a script');
  return new Promise(function (resolve, reject) {
    var s1 = document.createElement('script');
    s1.src = m[1];
    s1.onload = function () {
      try {
        var s2 = document.createElement('script');
        s2.textContent = inline[1];
        document.body.appendChild(s2);          /* runs b64GzScript, defines M64 */
        if (typeof M64 !== 'function') throw new Error('M64 did not appear');
        resolve();
      } catch (e) { reject(e); }
    };
    s1.onerror = function () { reject(new Error('the gunzip helper script failed to load')); };
    document.body.appendChild(s1);
  });
}

/* ------------------------------------------------------------ binding
   (from nopsta's m64-wrappers.js by way of player/tail.template.html) */
var m64 = null;
var m64_init, m64_audioInit, m64_injectAndRunPrg, m64_loadCartridge, m64_joystickPush, m64_joystickRelease,
    m64_keyPush, m64_keyRelease, m64_getPixelBuffer, m64_getPixelBufferWidth,
    m64_getAudioBuffer, m64_update, m64_setKernalROM, m64_setBASICROM, m64_setCharacterROM,
    m64_cpuRead, m64_cpuWrite;
var ROMS = null;

function bind() {
  return new Promise(function (resolve, reject) {
    var timer = setTimeout(function () { reject(refusal('START_FAILED', 'the emulator did not initialise within 20 s')); }, 20000);
    try {
      m64 = M64({ onAbort: function (what) { clearTimeout(timer); reject(refusal('START_FAILED', 'the emulator aborted: ' + what)); } });
    } catch (e) { clearTimeout(timer); reject(refusal('START_FAILED', 'the emulator did not start: ' + (e && e.message || e))); return; }
    m64_init             = m64.cwrap('m64_init', null, ['number', 'number']);
    m64_audioInit        = m64.cwrap('m64_audioInit', null, ['number', 'number']);
    m64_injectAndRunPrg  = m64.cwrap('m64_injectAndRunPrg', null, ['array', 'number', 'number']);
    m64_loadCartridge    = m64.cwrap('m64_loadCartridge', null, ['array', 'number']);
    m64_joystickPush     = m64.cwrap('m64_joystickPush', null, ['number', 'number']);
    m64_joystickRelease  = m64.cwrap('m64_joystickRelease', null, ['number', 'number']);
    m64_keyPush          = m64.cwrap('m64_keyPush', null, ['number']);
    m64_keyRelease       = m64.cwrap('m64_keyRelease', null, ['number']);
    m64_getPixelBuffer      = m64.cwrap('m64_getPixelBuffer', 'number');
    m64_getPixelBufferWidth = m64.cwrap('m64_getPixelBufferWidth', 'number');
    m64_getAudioBuffer      = m64.cwrap('m64_getAudioBuffer', 'number');
    m64_update              = m64.cwrap('m64_update', 'number', ['number']);
    m64_setKernalROM        = m64.cwrap('m64_setKernalROM', null, ['array', 'number']);
    m64_setBASICROM         = m64.cwrap('m64_setBASICROM', null, ['array', 'number']);
    m64_setCharacterROM     = m64.cwrap('m64_setCharacterROM', null, ['array', 'number']);
    m64_cpuRead             = m64.cwrap('m64_cpuRead', 'number', ['number']);
    m64_cpuWrite            = m64.cwrap('m64_cpuWrite', null, ['number', 'number']);
    m64['onRuntimeInitialized'] = function () { clearTimeout(timer); resolve(); };
  });
}

/* ------------------------------------------------------------ video */
var canvas = document.getElementById('screen');
var pixelWidth = 0, pixelHeight = 272, ctx = null, imageData = null, lastTs = false;
function frame(ts) {
  try {
    if (lastTs !== false) {
      var dt = ts - lastTs;
      if (dt > 200) dt = 16.666;
      if (m64_update(dt)) {
        var ptr = m64_getPixelBuffer();
        var len = pixelWidth * pixelHeight * 4;
        imageData.data.set(m64.HEAPU8.subarray(ptr, ptr + len));
        ctx.putImageData(imageData, 0, 0);
      }
    }
  } catch (e) {
    /* an exception inside the emulator's frame is the machine's own fault: fatal, said once, the loop stopped */
    fatal('the emulator failed in its frame loop: ' + String(e && e.message || e));
    return;
  }
  lastTs = ts;
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------ audio
   (from nopsta's m64-webaudio.js; a browser needs one gesture first) */
var audioBufferSize = 0, audioContext = false, gainNode = false, volume = 0.8;
var audioNextPlayTime = 0, audioBufferDurationSecs = 0, audioSampleFrequency = 0;
var pushAudioLastTime = 0, pauseCounter = 0;
function pushAudio() {
  if (hostAudio) return;
  if (audioContext.currentTime - pushAudioLastTime > (audioBufferSize * 2) / audioSampleFrequency) {
    pushAudioLastTime = audioContext.currentTime; pauseCounter = 10; return;
  }
  pushAudioLastTime = audioContext.currentTime;
  if (pauseCounter > 0) { pauseCounter--; return; }
  if (audioContext.currentTime + audioBufferDurationSecs * 2 < audioNextPlayTime) return;
  audioNextPlayTime += audioBufferDurationSecs;
  var src = audioContext.createBufferSource();
  src.addEventListener('ended', pushAudio);
  var buf = audioContext.createBuffer(1, audioBufferSize, audioSampleFrequency);
  src.connect(gainNode);
  var ptr = m64_getAudioBuffer();
  buf.getChannelData(0).set(m64.HEAPF32.subarray(ptr >> 2, (ptr >> 2) + audioBufferSize));
  src.buffer = buf;
  src.start(audioNextPlayTime);
}
function runTimer() {
  pushAudio();
  var src = audioContext.createBufferSource();
  src.addEventListener('ended', runTimer);
  src.connect(audioContext.destination);
  src.buffer = audioContext.createBuffer(1, audioBufferSize / 4, audioSampleFrequency);
  src.start(audioContext.currentTime);
}
function setupAudioNodes() {
  if (audioContext.state !== 'running' || gainNode) return;
  gainNode = audioContext.createGain();
  gainNode.gain.value = volume;
  gainNode.connect(audioContext.destination);
  audioNextPlayTime = audioContext.currentTime + 3 * audioBufferDurationSecs;
  m64_audioInit(audioBufferSize, audioContext.sampleRate);
  runTimer();
  setInterval(pushAudio, 4);
}
/* The host may take the sound instead (protocol: audio, samples): a browser
   lets sound start only on a gesture in the document that plays it, and a
   host's buttons are not in this one. While the host has it, this document
   plays nothing of its own. */
var hostAudio = false, hostBufferSize = 4096;
function startAudio() {
  if (!m64 || hostAudio) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    audioBufferSize = 4096;
    if (!audioContext) {
      audioContext = new AC();
      audioSampleFrequency = audioContext.sampleRate;
      audioBufferDurationSecs = audioBufferSize / audioSampleFrequency;
      audioContext.onstatechange = setupAudioNodes;
    }
    if (audioContext.state !== 'running') audioContext.resume();
    setupAudioNodes();
  } catch (e) {}
}
document.addEventListener('pointerdown', startAudio);
document.addEventListener('keydown', startAudio);
document.addEventListener('touchend', function (e) { startAudio(); e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', function (e) { e.preventDefault(); });

      if ([1, 2, 4, 8, 16].indexOf(m.bit) < 0) { refuse(m, 'BAD_MESSAGE', 'bit is 1, 2, 4, 8 or 16'); return; }
      if (m.port !== undefined && m.port !== 1 && m.port !== 2) { refuse(m, 'BAD_MESSAGE', 'port is 1 or 2'); return; }

      if (m.text.length > LIMITS.text) { refuse(m, 'BAD_MESSAGE', 'text is at most ' + LIMITS.text + ' characters'); return; }
      if (typing) { refuse(m, 'BUSY', 'still typing'); return; }

      if (!labOn) { refuse(m, 'LAB_OFF', 'a write to the machine needs lab on; a run that takes one is INTERVENED'); return; }
      if (m.addr < 0 || m.addr > 0xffff || m.value < 0 || m.value > 0xff) { refuse(m, 'BAD_MESSAGE', 'addr is 0..65535 and value is 0..255'); return; }

    case 'audio': {
      if (STATE.phase !== 'running') { refuse(m, 'NOT_READY', 'the machine is not running'); return; }
      if (!m.on) { hostAudio = false; reply(m, { type: 'ok', audio: false }); return; }
      var bs = m.bufferSize === undefined ? 4096 : m.bufferSize;
      if ([512, 1024, 2048, 4096, 8192].indexOf(bs) < 0) { refuse(m, 'BAD_MESSAGE', 'bufferSize is 512, 1024, 2048, 4096 or 8192'); return; }
      if (m.sampleRate === undefined || m.sampleRate < 8000 || m.sampleRate > 192000) { refuse(m, 'BAD_MESSAGE', 'sampleRate is 8000 to 192000'); return; }

      if (audioContext && audioContext.state === 'running') { try { audioContext.suspend(); } catch (e) {} }

    }
    case 'samples': {
      if (STATE.phase !== 'running') { refuse(m, 'NOT_READY', 'the machine is not running'); return; }
      if (!hostAudio) { refuse(m, 'AUDIO_OFF', 'send audio {on: true, sampleRate} first'); return; }
      var sp = m64_getAudioBuffer();
      var samples = new Float32Array(hostBufferSize);

      if (port) { try { port.postMessage(sres, [samples.buffer]); } catch (e) {} }

    }

function attach(p) {

    });
  };
  if (port.start) port.start();
  if (STATE.phase === 'waiting') say('', true);
  event('hello', { protocol: PROTOCOL, machine: MACHINE, build: BUILD, phase: STATE.phase, capabilities: CAPABILITIES, limits: LIMITS });

window.addEventListener('message', function (e) {
  if (port || !e.ports || !e.ports[0]) return;

/* A fatal error of the machine's own: the document's script, the emulator's
   script (inline, or the gunzip helper's data URL) or the frame loop. Browser
   extensions inject scripts into every frame, this one included, and their
   failures there (a wallet that cannot reach its extension from a sandboxed
   frame, say) are not the machine's and must not stop it: an error whose
   source is not this document is noted on the console and otherwise
   ignored. */
function fatal(text) {

function ownSource(src) {
  src = String(src || '');
  return src === location.href || src.indexOf('data:') === 0;

window.addEventListener('error', function (e) {
  var text = String(e && (e.message || e.error) || 'error');

    try { console.warn('READY 64: an error from a script that is not this document\'s, ignored: ' + text + ' (' + (e && e.filename || 'no source') + ')'); } catch (x) {}

  }

    try { console.warn('READY 64: a rejection from a script that is not this document\'s, ignored: ' + text); } catch (x) {}
    return;
  }
  fatal(text);
});

/* ------------------------------------------------------------ boot */
/*@STANDALONE*/
async function boot() {
  try {
    var got = await fetchMachine();
    await startFromParts(got.parts, got.roms);
    if (PRG_HEX.length >= 6 && PRG_HEX.length % 2 === 0 && /^[0-9a-fA-F]+$/.test(PRG_HEX)) {
      loadPRG(hexToBytes(PRG_HEX), 'program from url');
    }
  } catch (e) {
    if (STATE.phase !== 'failed') { STATE.phase = 'failed'; STATE.error = String(e && e.message || e); say('failed: ' + STATE.error); }
  }
}
boot();
/*@END-STANDALONE*/
/*@EMBEDDED*/
STATE.phase = 'waiting';
say('the machine document: it waits for a host page to hand it the machine (standalone.html reads the chain itself)');
/*@END-EMBEDDED*/

/* ------------------------------------------------------------ api
   For a page that embeds the standalone from the same origin, or for a
   script run against it. Across the sandbox a host uses the bridge. */
window.READY64 = {
  version: 'core/0.2',
  protocol: PROTOCOL,
  state: STATE,
  loadPRG: function (bytes, label) { return loadPRG(bytes, label).ok; },
  reset: reset,
  type: typeText,
  screenText: screenText,
  peek: function (a) { return m64 ? m64_cpuRead(a & 0xffff) : -1; },
  poke: function (a, v) { if (m64) { m64_cpuWrite(a & 0xffff, v & 0xff); intervened = true; STATE.intervened = true; } },
  setInput: function (mode, port) { releaseAll(); INPUT = mode === 'joystick' ? 'joystick' : 'keyboard'; if (port === 1 || port === 2) JOYPORT = port; STATE.input = INPUT; },
  joystick: function (bit, down, port) { if (m64) (down ? m64_joystickPush : m64_joystickRelease)(((port === 1 || port === 2) ? port : JOYPORT) - 1, bit); },
  onStatus: function (cb) { listeners.push(cb); },
  startAudio: startAudio,
  canvas: canvas
};
</script>
