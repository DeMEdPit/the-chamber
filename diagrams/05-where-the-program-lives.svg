<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 800" role="img" aria-label="The Commodore 64 address space beside the Perception program">
<title>Where the program actually lives</title>
<style>
  .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f4f4ef}
  .title{font-size:17px}
  .sub{font-size:11.5px;fill:#aaa9a3}
  .hd{font-size:9.5px;fill:#aaa9a3;letter-spacing:.5px}
  .addr{font-size:10px;fill:#8a8984}
  .seg{font-size:10px;fill:#d8d7d1}
  .tiny{font-size:9px;fill:#d8d7d1}
  .note{font-size:11px;fill:#aaa9a3}
  .acc{font-size:11px;fill:#39ff88}
  .ln{stroke:#4a4a46;stroke-width:1;fill:none}
</style>
<rect x="0" y="0" width="440" height="800" fill="#0b0b0b"/>
<text class="t title" x="20" y="36">Where the program lives</text>
<text class="t sub" x="20" y="58">The ROMs and I/O are overlays, not walls.</text>
<text class="t sub" x="20" y="76">The RAM beneath them is real — and it is used.</text>
<text class="t hd" x="89.0" y="138" text-anchor="middle">the chip</text>
<text class="t hd" x="159.0" y="138" text-anchor="middle">our program</text>
<rect x="60" y="150.0" width="58" height="343.8" fill="#141414" stroke="#2e2e2e"/>
<text class="t seg" x="89.0" y="325.4" text-anchor="middle">RAM</text>
<rect x="60" y="493.8" width="58" height="68.8" fill="#1c1c1c" stroke="#3a3a3a"/>
<text class="t seg" x="89.0" y="531.6" text-anchor="middle">BASIC</text>
<rect x="60" y="562.5" width="58" height="34.4" fill="#141414" stroke="#2e2e2e"/>
<text class="t seg" x="89.0" y="583.2" text-anchor="middle">RAM</text>
<rect x="60" y="596.9" width="58" height="34.4" fill="#1c1c1c" stroke="#3a3a3a"/>
<text class="t seg" x="89.0" y="617.6" text-anchor="middle">I/O</text>
<rect x="60" y="631.2" width="58" height="68.8" fill="#1c1c1c" stroke="#3a3a3a"/>
<text class="t seg" x="89.0" y="669.1" text-anchor="middle">KERNAL</text>
<rect x="130" y="150.0" width="58" height="17.2" fill="#141414" stroke="#2e2e2e"/>
<rect x="130" y="167.2" width="58" height="437.3" fill="#132018" stroke="#39ff88"/>
<rect x="130" y="604.5" width="58" height="95.5" fill="#141414" stroke="#2e2e2e"/>
<rect x="130" y="398.4" width="58" height="7" fill="#39ff88"/>
<text class="t tiny" x="159.0" y="253.1" text-anchor="middle" fill="#39ff88">52,104 B</text>
<text class="t addr" x="46" y="153.5" text-anchor="end">$0000</text>
<line class="ln" x1="50" y1="150.0" x2="58" y2="150.0"/>
<text class="t addr" x="46" y="170.7" text-anchor="end">$0801</text>
<line class="ln" x1="50" y1="167.2" x2="58" y2="167.2"/>
<text class="t addr" x="46" y="404.9" text-anchor="end">$7500</text>
<line class="ln" x1="50" y1="401.4" x2="58" y2="401.4"/>
<text class="t addr" x="46" y="497.2" text-anchor="end">$A000</text>
<line class="ln" x1="50" y1="493.8" x2="58" y2="493.8"/>
<text class="t addr" x="46" y="600.4" text-anchor="end">$D000</text>
<line class="ln" x1="50" y1="596.9" x2="58" y2="596.9"/>
<text class="t addr" x="46" y="703.5" text-anchor="end">$FFFF</text>
<line class="ln" x1="50" y1="700.0" x2="58" y2="700.0"/>
<line x1="50" y1="493.8" x2="196" y2="493.8" stroke="#6f6f68" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="50" y1="596.9" x2="196" y2="596.9" stroke="#6f6f68" stroke-width="1" stroke-dasharray="2 4"/>
<line class="ln" x1="188" y1="401.4" x2="198" y2="401.4"/>
<text class="t acc" x="204" y="397.3671875">the brain — 834 bytes</text>
<text class="t note" x="204" y="413.3671875">the only part the</text>
<text class="t note" x="204" y="429.3671875">chain writes</text>
<line class="ln" x1="188" y1="528.1" x2="198" y2="528.1"/>
<text class="t note" x="204" y="524.125">8,192 bytes sit under</text>
<text class="t note" x="204" y="540.125">the BASIC ROM window</text>
<line class="ln" x1="188" y1="600.6" x2="198" y2="600.6"/>
<text class="t note" x="204" y="602.634765625">903 bytes sit under</text>
<text class="t note" x="204" y="618.634765625">the VIC and SID</text>
<text class="t note" x="204" y="634.634765625">registers. 433 are</text>
<text class="t note" x="204" y="650.634765625">non-zero.</text>
<line x1="20" y1="738" x2="420" y2="738" stroke="#262626"/>
<text class="t note" x="20" y="762">minimal64 boots with no BASIC ROM, so nearly</text>
<text class="t note" x="20" y="778">all 64 KB is available.  F-002, F-008</text>
</svg>