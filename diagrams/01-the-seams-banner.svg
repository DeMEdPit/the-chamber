<style>
  .f{fill:#131313;stroke:#2e2e2e;stroke-width:3.0}
  /* The innermost keeps its matte green interior at rest, and a grey border
     like every other wall - settled on the diagram, and it holds here. */
  .f8{fill:#111a15;stroke:#2e2e2e;stroke-width:3.0}

  /* 0.45s to swell, 1.62s back to nothing, 0.5s between walls.
     The last lights at 3.5s and is gone at 6.2s, leaving
     1.3s of rest in a 7.5s cycle. A GIF of this needs
     --cycle 7.5 --motion 6.3: the capture has to reach the
     end of the arrival's long fall, or it freezes mid-bloom. */
  .halo{fill:none;stroke:#39ff88;stroke-width:4.5;opacity:0;pointer-events:none;
        animation:haloSwell 7.5s ease-in-out infinite}
  #halo-1{animation-delay:0s}
  #halo-2{animation-delay:0.5s}
  #halo-3{animation-delay:1s}
  #halo-4{animation-delay:1.5s}
  #halo-5{animation-delay:2s}
  #halo-6{animation-delay:2.5s}
  #halo-7{animation-delay:3s}

  /* Only the last one is different, and that is the point: the light does not
     run round its border, it fills the whole frame and blooms. */
  #halo-8{animation-delay:3.5s;animation-name:haloArrive}
  #halo-8g{animation-delay:3.5s;animation-name:haloGlow}
  .fill{fill:#39ff88;stroke:#39ff88;stroke-width:3}
  .glow{fill:#39ff88;stroke:none;filter:url(#bloom)}

  @keyframes haloSwell {0%{opacity:0} 6.0%{opacity:.6} 21.6%{opacity:0} 100%{opacity:0}}
  @keyframes haloArrive{0%{opacity:0} 6.0%{opacity:.85} 36.0%{opacity:0} 100%{opacity:0}}
  @keyframes haloGlow  {0%{opacity:0} 6.0%{opacity:.55} 36.0%{opacity:0} 100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ .halo{animation:none;opacity:0} }
</style>
