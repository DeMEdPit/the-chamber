<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" width="1600" height="320" role="img" aria-label="8 frames nested one inside the next, a light travelling inward wall by wall until the smallest one fills with it and fades">
<title>The seams</title>
