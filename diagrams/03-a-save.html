<figure class="dg dg-save">
  <figcaption class="dg-cap">
    <p class="dg-head">A save, end to end</p>
    <p class="dg-sub">The chain never watches the teaching. It re-derives it, and checks the answer against the claim.</p>
  </figcaption>

  <div class="dg-lanes">
    <section class="lane lane-off">
      <p class="lane-hd">OFF CHAIN · ONE BROWSER</p>

      <div class="bx">
        <p class="bx-name">a person teaches</p>
        <p class="bx-dim">inside the running C64, on the token page</p>
      </div>
      <span class="dg-down"></span>
      <div class="bx">
        <p class="bx-name">the lessons pile up</p>
        <p class="bx-dim"><code>n UNSAVED</code> — nothing has left the browser yet</p>
      </div>
      <span class="dg-down"></span>
      <div class="bx">
        <p class="bx-name">one envelope, built once</p>
        <p class="bx-dim">the parent revision · the parent hash</p>
        <p class="bx-dim">the lessons themselves</p>
        <p class="bx-dim">the claimed child hash</p>
      </div>
      <p class="dg-cross">one transaction</p>

      <div class="bx dg-back">
        <p class="bx-name">back in the browser</p>
        <p class="bx-dim">the page re-reads the head after the receipt</p>
      </div>
    </section>

    <section class="lane lane-on">
      <p class="lane-hd">ON CHAIN · EVERY NODE</p>

      <div class="bx">
        <p class="bx-head"><span class="bx-name">saveMind</span><span class="bx-dim">every check before any write</span></p>
        <ol class="steps">
          <li>the holder — never an operator</li>
          <li>the batch bound, 32 lessons</li>
          <li>the parent revision is not stale</li>
          <li>the parent bytes, the parent blob</li>
        </ol>
        <ol class="steps core-wrap" start="5">
          <li class="core">replay every lesson from the parent</li>
          <li class="core">compare the result to the claim</li>
        </ol>
        <ol class="steps" start="7">
          <li>a save that changes nothing reverts</li>
          <li>admission — the slot is canonical</li>
          <li>persist, append, emit</li>
        </ol>
        <div class="bx-rule">
          <p class="bx-dim">Steps 5 and 6 are the whole claim. Everything else guards them.</p>
          <p class="bx-dim">Stricter than our own reference. <span class="dg-fid">F-014</span></p>
        </div>
      </div>

      <div class="dg-out">
        <div class="bx bx-lit">
          <p class="bx-name on">the head advances</p>
          <p class="bx-dim">a new revision</p>
        </div>
        <div class="bx">
          <p class="bx-name">it reverts</p>
          <p class="bx-dim">nothing is written</p>
        </div>
      </div>
    </section>
  </div>

  <p class="dg-foot"><b>What is validated:</b> that the claimed brain is the necessary consequence of the claimed lessons under the stated rule.</p>
  <p class="dg-foot"><b>What is not:</b> whether the learning was any good, and who sat at the keyboard — <code>savedBy</code> is an address. <span class="dg-fid">F-013, F-015</span></p>
</figure>
