<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" width="920" height="690" role="img" aria-label="The seams: four nested machines, each boundary a place where findings live">
<title>The seams</title>
<style>
  .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f4f4ef}
  .title{font-size:19px;letter-spacing:.4px}
  .sub{font-size:12.5px;fill:#aaa9a3}
  .name{font-size:14px}
  .body{font-size:12.5px;fill:#d8d7d1}
  .dim{font-size:11.5px;fill:#aaa9a3}
  .chip{font-size:11px;fill:#39ff88;letter-spacing:.3px}
  .box{fill:#141414;stroke:#2e2e2e;stroke-width:1}
  .boxa{fill:#111a15;stroke:#2e2e2e;stroke-width:1}
  .ln{stroke:#4a4a46;stroke-width:1.4;fill:none}
  .lna{stroke:#39ff88;stroke-width:1.6;fill:none}

  /* An ambient glow travelling INWARD: Ethereum, the browser, the machine,
     the mind. That is the boot order, and it is what happens every time
     anyone opens the token - so it is the thing that should repeat.
     Absolute timings, held constant if the cycle length is retuned:
     0.46s to swell, 1.63s back to nothing, 0.7s between rings. The last
     ring finishes at 3.73s, so a 6s cycle rests for 2.3s. */
  .halo{fill:none;stroke:#39ff88;stroke-width:2.5;opacity:0;pointer-events:none;
        animation:haloSwell 6s ease-in-out infinite}
  #halo-eth{animation-delay:0s}
  #halo-br{animation-delay:.7s}
  #halo-c64{animation-delay:1.4s}
  /* The innermost ring rises with the others and at the same brightness;
     only its fall is longer - 2.25s against 1.17s - so the light leaves
     it last. It still reaches nothing, and its border still returns to
     grey like every other wall. */
  #halo-pc{animation-delay:2.1s;animation-name:haloLong}
  @keyframes haloSwell{
    0%{opacity:0} 7.5%{opacity:.55} 27%{opacity:0} 100%{opacity:0}
  }
  @keyframes haloLong{
    0%{opacity:0} 7.5%{opacity:.55} 45%{opacity:0} 100%{opacity:0}
  }
  @media (prefers-reduced-motion:reduce){ .halo{animation:none;opacity:0} }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#4a4a46"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#39ff88"/></marker>
</defs>
<rect x="0" y="0" width="920" height="690" fill="#0b0b0b"/>
<text class="t title" x="40" y="42">The seams</text>
<text class="t sub"   x="40" y="63">Four machines, each inside the next. Every finding so far sits on one of these walls.</text>

<rect class="box"  x="220" y="86"  width="660" height="486" rx="5"/>
<rect class="box"  x="268" y="138" width="564" height="382" rx="5"/>
<rect class="box"  x="316" y="190" width="468" height="278" rx="5"/>
<rect class="boxa" x="364" y="242" width="372" height="174" rx="5"/>

<rect class="halo" id="halo-eth" x="220" y="86"  width="660" height="486" rx="5"/>
<rect class="halo" id="halo-br"  x="268" y="138" width="564" height="382" rx="5"/>
<rect class="halo" id="halo-c64" x="316" y="190" width="468" height="278" rx="5"/>
<rect class="halo" id="halo-pc"  x="364" y="242" width="372" height="174" rx="5"/>

<text class="t name" x="236" y="112">Ethereum</text>
<text class="t chip" x="864" y="112" text-anchor="end">F-009 – F-011</text>
<text class="t dim"  x="550" y="552" text-anchor="middle">nine contracts of ours, and four of nopsta's from 2022</text>

<text class="t name" x="284" y="164">the browser</text>
<text class="t chip" x="816" y="164" text-anchor="end">F-005 – F-008</text>
<text class="t dim"  x="550" y="500" text-anchor="middle">WebAssembly · Canvas · Web Audio · one frozen page</text>

<text class="t name" x="332" y="216">the Commodore 64</text>
<text class="t chip" x="768" y="216" text-anchor="end">F-001 – F-004</text>
<text class="t dim"  x="550" y="448" text-anchor="middle">52,104 bytes at $0801 — 80% of the whole machine</text>

<text class="t name" x="380" y="268" fill="#39ff88">the perceptron</text>
<text class="t chip" x="720" y="268" text-anchor="end">F-013 – F-018</text>
<text class="t body" x="550" y="356" text-anchor="middle">834 bytes · 800 weights · one layer</text>
<text class="t dim"  x="550" y="378" text-anchor="middle">in a hole in a frozen program, at $7500</text>

<rect class="box" x="40" y="274" width="150" height="72" rx="5"/>
<text class="t name" x="115" y="306" text-anchor="middle">a person</text>
<text class="t dim"  x="115" y="326" text-anchor="middle">outside all of it</text>

<path class="lna" d="M190,310 L356,310" marker-end="url(#ag)"/>
<text class="t chip free" x="198" y="300">teaches</text>

<path class="ln" d="M220,180 L100,180 L100,270" marker-end="url(#a)"/>
<text class="t dim" x="40" y="142">reads</text>
<text class="t dim" x="40" y="160">free · one node · F-012</text>

<path class="lna" d="M120,346 L120,506 L214,506" marker-end="url(#ag)"/>
<text class="t dim" x="40" y="534">saves</text>
<text class="t dim" x="40" y="552">judged by every node</text>

<line x1="40" y1="606" x2="880" y2="606" stroke="#262626" stroke-width="1"/>
<text class="t dim" x="40" y="632">The program crosses every wall: held on Ethereum, served through the browser, run by the C64.</text>
<text class="t dim" x="40" y="654">Nothing interesting has come from inside one machine.  F-019 – F-023 are about how we work, not a wall.</text>
</svg>
