<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 576" width="920" height="576" role="img" aria-label="Three independent implementations of the same learner produce the same 834 bytes">
<style>
  .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f4f4ef}
  .title{font-size:19px;letter-spacing:.4px}
  .sub{font-size:12.5px;fill:#aaa9a3}
  .name{font-size:14px}
  .big{font-size:17px;fill:#39ff88;letter-spacing:.3px}
  .dim{font-size:11.5px;fill:#aaa9a3}
  .tag{font-size:10.5px;letter-spacing:.4px}
  .box{fill:#141414;stroke:#2e2e2e;stroke-width:1}
  .ln{stroke:#4a4a46;stroke-width:1.4;fill:none}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#4a4a46"/></marker>
</defs>
<rect x="0" y="0" width="920" height="576" fill="#0b0b0b"/>
<text class="t title" x="40" y="42">One learner, written three times</text>
<text class="t sub"   x="40" y="63">Three architectures, no floats, no clocks, no external calls — and therefore one answer.</text>

<rect class="box" x="40"  y="110" width="254" height="104" rx="5"/>
<text class="t name" x="64"  y="140">6510 assembly</text>
<text class="t dim"  x="64"  y="163">inside the frozen PRG</text>
<text class="t dim"  x="64"  y="183">runs on a Commodore 64</text>
<text class="t tag"  x="64"  y="203" fill="#39ff88">SHIPS</text>

<rect class="box" x="333" y="110" width="254" height="104" rx="5"/>
<text class="t name" x="357" y="140">Python — the oracle</text>
<text class="t dim"  x="357" y="163">vendor/brain025, pinned</text>
<text class="t dim"  x="357" y="183">runs at build time only</text>
<text class="t tag"  x="357" y="203" fill="#aaa9a3">SCAFFOLDING · REMOVED</text>

<rect class="box" x="626" y="110" width="254" height="104" rx="5"/>
<text class="t name" x="650" y="140">Solidity</text>
<text class="t dim"  x="650" y="163">Brain025.sol</text>
<text class="t dim"  x="650" y="183">runs on Ethereum</text>
<text class="t tag"  x="650" y="203" fill="#39ff88">SHIPS</text>

<path class="ln" d="M167,214 L167,262"/>
<path class="ln" d="M460,214 L460,262"/>
<path class="ln" d="M753,214 L753,262"/>
<path class="ln" d="M167,262 L753,262"/>
<circle cx="167" cy="262" r="3" fill="#4a4a46"/>
<circle cx="753" cy="262" r="3" fill="#4a4a46"/>
<path class="ln" d="M460,262 L460,316" marker-end="url(#a)"/>
<text class="t dim" x="476" y="292">held to 64 packaged fixtures, every check</text>

<rect x="280" y="322" width="360" height="96" rx="5" fill="#111a15" stroke="#39ff88" stroke-width="1.25"/>
<text class="t big" x="460" y="358" text-anchor="middle">the same 834 bytes</text>
<text class="t dim" x="460" y="382" text-anchor="middle">vis4 · 240 of 240 lessons · every byte</text>
<text class="t dim" x="460" y="402" text-anchor="middle">sha256 4e957ef7… equals the claim</text>

<line x1="40" y1="462" x2="880" y2="462" stroke="#262626" stroke-width="1"/>
<text class="t dim" x="40" y="488">None is a port of another. Each was written against the same specification, then held to the others byte for byte.</text>
<text class="t dim" x="40" y="510">Three is the minimum for a vote: with two, a disagreement tells you there is a bug but not which side has it.</text>
<text class="t dim" x="40" y="532">This is the property that makes Ethereum work at all — consensus is determinism at network scale.  F-018</text>
</svg>
