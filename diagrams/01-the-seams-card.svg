<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="8 frames nested one inside the next, a light travelling inward wall by wall until the smallest one fills with it and fades">
<title>The seams</title>
