    <tbody>

        <td class="c4" data-col="Perception"><span class="dot"></span></td>

      <tr><th scope="row">A page assembled on chain, with no server</th>
        <td class="c0 none" data-col="minimal64"></td>
        <td class="c1" data-col="READY 64"><span class="cell new">Launcher</span></td>
        <td class="c2 none" data-col="OpenROMs 1"></td>

        <td class="c4" data-col="Perception"><span class="cell again">PerceptionLauncher</span></td>

        <td class="c2 none" data-col="OpenROMs 1"></td>

        <td class="c1" data-col="READY 64"><span class="cell new">PoC721</span></td>
        <td class="c2 none" data-col="OpenROMs 1"></td>
        <td class="c3" data-col="The Chamber"><span class="cell again">Chamber</span></td>
        <td class="c4" data-col="Perception"><span class="cell again">PerceptionChamber</span></td>
      </tr>
      <tr><th scope="row">Firmware published on chain</th>
        <td class="c0 none" data-col="minimal64"></td>

      <tr><th scope="row">Source archived on chain</th>
        <td class="c0 none" data-col="minimal64"></td>
        <td class="c1 none" data-col="READY 64"></td>
        <td class="c2" data-col="OpenROMs 1"><span class="cell new">Archive</span></td>
        <td class="c3 none" data-col="The Chamber"></td>
        <td class="c4 none" data-col="Perception"></td>
      </tr>
      <tr><th scope="row">A frozen program with a hole in it</th>
        <td class="c0 none" data-col="minimal64"></td>
        <td class="c1 none" data-col="READY 64"></td>
        <td class="c2 none" data-col="OpenROMs 1"></td>
        <td class="c3" data-col="The Chamber"><span class="cell new">ChamberBase</span></td>
        <td class="c4" data-col="Perception"><span class="cell again">PerceptionProgram</span></td>

      <tr><th scope="row">Facts the chain already had, written in</th>
        <td class="c0 none" data-col="minimal64"></td>
        <td class="c1 none" data-col="READY 64"></td>
        <td class="c2 none" data-col="OpenROMs 1"></td>
        <td class="c3" data-col="The Chamber"><span class="cell new">42 bytes</span></td>
        <td class="c4 none" data-col="Perception"></td>

      <tr><th scope="row">Many tokens over one program</th>
        <td class="c0 none" data-col="minimal64"></td>
        <td class="c1 none" data-col="READY 64"></td>
        <td class="c2 none" data-col="OpenROMs 1"></td>
        <td class="c3" data-col="The Chamber"><span class="cell new">64 tokens</span></td>

        <td class="c3 none" data-col="The Chamber"></td>
        <td class="c4" data-col="Perception"><span class="cell new">Brain025</span></td>

      <tr><th scope="row">A result the chain had to compute</th>
        <td class="c0 none" data-col="minimal64"></td>
        <td class="c1 none" data-col="READY 64"></td>
        <td class="c2 none" data-col="OpenROMs 1"></td>
        <td class="c3 none" data-col="The Chamber"></td>
        <td class="c4" data-col="Perception"><span class="cell new">834 bytes</span></td>

      <tr><th scope="row">A chain of revisions, each with a parent</th>
        <td class="c0 none" data-col="minimal64"></td>
        <td class="c1 none" data-col="READY 64"></td>
        <td class="c2 none" data-col="OpenROMs 1"></td>
        <td class="c3 none" data-col="The Chamber"></td>

        <td class="c2 none" data-col="OpenROMs 1"></td>

  <p class="dg-foot">OpenROMs pressing 1 is a side branch, not a rung: it publishes firmware, and neither artwork loads it — both boot bare.</p>
  <p class="dg-foot">The Chamber imports READY 64&#x27;s Launcher verbatim and pins its bytecode.<span class="dg-w"> Base64 has now been written three times, each faster.</span></p>
  <p class="dg-foot">The escalation is in the hole: 42 bytes of facts the chain already had, then 834 bytes it had to compute and could be wrong about.</p>
</figure>
