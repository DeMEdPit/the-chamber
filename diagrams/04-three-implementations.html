<figure class="dg dg-three-up">
  <figcaption class="dg-cap">
    <p class="dg-head">One learner, written three times</p>
    <p class="dg-sub">Three architectures, no floats, no clocks, no external calls — and therefore one answer.</p>
  </figcaption>

  <ul class="dg-three">
    <li class="bx">
      <p class="bx-name">6510 assembly</p>
      <p class="bx-dim">inside the frozen PRG</p>
      <p class="bx-dim">runs on a Commodore 64</p>
      <p class="bx-tag on">SHIPS</p>
    </li>
    <li class="bx">
      <p class="bx-name">Python — the oracle</p>
      <p class="bx-dim"><code>vendor/brain025</code>, pinned</p>
      <p class="bx-dim">runs at build time only</p>
      <p class="bx-tag">SCAFFOLDING · REMOVED</p>
    </li>
    <li class="bx">
      <p class="bx-name">Solidity</p>
      <p class="bx-dim"><code>Brain025.sol</code></p>
      <p class="bx-dim">runs on Ethereum</p>
      <p class="bx-tag on">SHIPS</p>
    </li>
  </ul>

  <p class="dg-join">held to 64 packaged fixtures, every check</p>

  <div class="bx bx-lit dg-result">
    <b>the same 834 bytes</b>
    <span>vis4 · 240 of 240 lessons · every byte</span>
    <span>sha256 <code>4e957ef7…</code> equals the claim</span>
  </div>

  <p class="dg-foot">None is a port of another. Each was written against the same specification, then held to the others byte for byte.</p>
  <p class="dg-foot">Three is the minimum for a vote: with two, a disagreement tells you there is a bug but not which side has it.</p>
  <p class="dg-foot">This is the property that makes Ethereum work at all — consensus is determinism at network scale. <span class="dg-fid">F-018</span></p>
</figure>
